# Test Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Configuration - FIX High #5: Cung cấp secret key cho test
jwt.secret=test-secret-key-for-jwt-token-generation-minimum-256-bits-required-for-hs256-algorithm
jwt.expiration=86400000
jwt.refresh.expiration=604800000

# VNPay Configuration - FIX High #4: Cung cấp config cho test
vnpay.tmn-code=TESTCODE
vnpay.hash-secret=TESTHASHSECRET12345678901234567890
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/api/vnpay/callback
vnpay.version=2.1.0
vnpay.command=pay
vnpay.order-type=other

# Logging
logging.level.com.utetea.backend=DEBUG
logging.level.org.springframework.security=DEBUG

# Mail Configuration (disabled for tests)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
