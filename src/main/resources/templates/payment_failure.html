<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán thất bại</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { margin: 0; padding: 20px; background: #fff5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; width: 100%; max-width: 400px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 32px; text-align: center; }
        .icon { font-size: 64px; margin-bottom: 16px; }
        h2 { color: #c62828; margin: 0 0 16px 0; }
        p { color: #666; margin: 0 0 16px 0; }
        .error-code { background: #ffebee; border-radius: 8px; padding: 12px; margin: 16px 0; font-size: 14px; color: #c62828; }
        .btn { display: inline-block; padding: 14px 32px; background: #f44336; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; margin: 8px; }
        .btn-secondary { background: #757575; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">❌</div>
        <h2>Thanh toán thất bại</h2>
        <p th:text="${message}">Giao dịch không thành công</p>
        <div class="error-code" th:if="${responseCode != null}">
            <p>Mã lỗi: <strong th:text="${responseCode}">N/A</strong></p>
        </div>
        <p>Vui lòng thử lại hoặc chọn phương thức thanh toán khác.</p>
        <a href="myapp://payment/failure" class="btn">Thử lại</a>
        <a href="myapp://payment/exit" class="btn btn-secondary">Hủy đơn</a>
    </div>
</body>
</html>
