<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán thành công</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { margin: 0; padding: 20px; background: #f0f9f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; width: 100%; max-width: 400px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 32px; text-align: center; }
        .icon { font-size: 64px; margin-bottom: 16px; }
        h2 { color: #2e7d32; margin: 0 0 16px 0; }
        p { color: #666; margin: 0 0 8px 0; }
        .amount { font-size: 24px; font-weight: bold; color: #2e7d32; margin: 16px 0; }
        .transaction-info { background: #f5f5f5; border-radius: 8px; padding: 12px; margin: 16px 0; font-size: 14px; color: #666; }
        .btn { display: inline-block; padding: 14px 32px; background: #4caf50; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✅</div>
        <h2>Thanh toán thành công!</h2>
        <p>Đơn hàng của bạn đã được xác nhận</p>
        <div class="amount" th:text="${#numbers.formatInteger(amount, 0, 'COMMA')} + ' VNĐ'">0 VNĐ</div>
        <div class="transaction-info">
            <p>Mã giao dịch: <strong th:text="${transactionNo}">N/A</strong></p>
        </div>
        <p>Đơn hàng đang được xử lý và sẽ sớm được giao đến bạn.</p>
        <a href="myapp://payment/success" class="btn">Quay lại ứng dụng</a>
    </div>
</body>
</html>
